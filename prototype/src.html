<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#123e32" />
<title>ISTA — Presensi &amp; SDM (Prototipe)</title>
<link rel="icon" href="__LOGO_URI__" />
<style>
/* ===== Design tokens (same as the real app) ===== */
:root{color-scheme:light;--bg:#f5f7f3;--card:#fff;--card-2:#f7f9f4;--subtle:#f0f3ec;--hover:#edf3ed;--line:#e4eae3;--line-soft:#edf0e8;--input-line:#dde5de;--text:#263c31;--ink:#203c2c;--ink-2:#3c563d;--muted:#78847c;--muted-2:#9aa492;--btn-text:#29453c;--brand:#29774b;--brand-dark:#1e603a;--ok:#2f7b46;--ok-soft:#edf4e9;--warn:#9a7f33;--warn-soft:#faf3df;--warn-line:#e9e2cb;--notice-bg:#faf8ee;--danger:#a86d4f;--danger-soft:#fbede5;--danger-line:#efd5c6;--info:#4f7f80;--info-soft:#e8f1f1;--demo-bg:#fff3cc;--demo-line:#e4c976;--demo-text:#8a6c22;--gold:#d8b757;--backdrop:#0f302a80}
.dark{color-scheme:dark;--bg:#0c1613;--card:#13201b;--card-2:#172720;--subtle:#1b2c25;--hover:#1e322a;--line:#24372f;--line-soft:#1e3029;--input-line:#2d4238;--text:#d3ded6;--ink:#eef4ef;--ink-2:#d0ddd3;--muted:#93a59a;--muted-2:#74897c;--btn-text:#d6e2d9;--brand:#2f8a56;--brand-dark:#38a165;--ok:#72c38f;--ok-soft:#173426;--warn:#d9bd6a;--warn-soft:#2a2616;--warn-line:#4a4224;--notice-bg:#1f1e14;--danger:#e39d7d;--danger-soft:#321f19;--danger-line:#5a3528;--info:#8cc4c4;--info-soft:#162f31;--demo-bg:#29240f;--demo-line:#5b4d1f;--demo-text:#e2c977;--backdrop:#000000a0}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 "DM Sans","Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,.display{font-family:Manrope,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit}
a{color:inherit}
svg.i{width:16px;height:16px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.hidden{display:none!important}

/* ===== Buttons, cards, tags ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--btn-text);padding:10px 16px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none;transition:background .15s}
.btn:hover{background:var(--hover)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn-primary:hover{background:var(--brand-dark)}
.btn-danger{color:var(--danger)}.btn-danger:hover{background:var(--danger-soft)}
.btn-sm{font-size:12px;padding:7px 11px}.btn-ghost{border-color:transparent;background:transparent}
.btn-block{width:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:21px}
.card.flush{padding:0}
.eyebrow{display:flex;align-items:center;gap:7px;text-transform:uppercase;font-size:10px;letter-spacing:1.7px;font-weight:800;color:var(--muted)}
.eyebrow::before{content:"";width:15px;height:2px;background:#c5aa56}
.page-title{font-family:Manrope,sans-serif;font-weight:800;font-size:27px;letter-spacing:-.9px;line-height:1.35;color:var(--ink);margin:8px 0 4px}
.page-sub{font-size:13px;color:var(--muted);margin:0}
.card-title{font-family:Manrope,sans-serif;font-size:15px;font-weight:700;color:var(--ink);margin:0}
.card-sub{font-size:12px;color:var(--muted);margin:2px 0 0}
.tag{display:inline-flex;align-items:center;gap:5px;border-radius:5px;padding:4px 8px;font-size:11px;font-weight:600;white-space:nowrap;background:var(--ok-soft);color:var(--ok)}
.tag-warn{background:var(--warn-soft);color:var(--warn)}.tag-bad{background:var(--danger-soft);color:var(--danger)}.tag-gray{background:var(--subtle);color:var(--muted)}.tag-blue{background:var(--info-soft);color:var(--info)}
.notice{border:1px solid var(--warn-line);background:var(--notice-bg);color:var(--warn);padding:12px 15px;border-radius:8px;font-size:12.5px;line-height:1.7}
.notice-bad{border-color:var(--danger-line);background:var(--danger-soft);color:var(--danger)}
.notice-ok{border-color:#2f7b4640;background:var(--ok-soft);color:var(--ok)}
.proto-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--demo-bg);border:1px solid var(--demo-line);padding:10px 14px;border-radius:8px;color:var(--demo-text);font-size:12px;margin-bottom:20px}
.proto-bar b{letter-spacing:1px}
.tiny{font-size:11px;color:var(--muted-2)}

/* ===== Forms ===== */
.field{display:block;font-size:12px;font-weight:500;color:var(--ink-2)}
.input{display:block;width:100%;margin-top:7px;border:1px solid var(--input-line);padding:11px 12px;border-radius:7px;background:var(--card);color:var(--ink);font-size:14px}
.input:focus{outline:2px solid #8abda5}
.input-inline{width:auto;margin-top:0;font-size:13px;padding:8px 11px}
textarea.input{min-height:80px;resize:vertical}

/* ===== Tables (become cards on phones) ===== */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;text-align:left;font-size:13px}
th{background:var(--card-2);font-size:10px;letter-spacing:.7px;text-transform:uppercase;color:var(--muted-2);font-weight:600;padding:12px;white-space:nowrap;border-bottom:1px solid var(--line-soft)}
td{padding:13px 12px;border-bottom:1px solid var(--line-soft);color:var(--muted);vertical-align:middle}
td strong{color:var(--ink-2);font-weight:600}
td small{display:block;color:var(--muted-2);font-size:11px;margin-top:3px}
@media (max-width:639px){
  thead{display:none}table,tbody{display:block}
  tr{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;padding:14px 16px;border-bottom:1px solid var(--line-soft)}
  td{display:block;padding:0;border:0;min-width:0}
  td::before{content:attr(data-label);display:block;margin-bottom:3px;font-size:10px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted-2)}
  td:first-child,td.wide,td[data-label=""]{grid-column:1/-1}
  td:first-child::before,td[data-label=""]::before{display:none}
}

/* ===== Layout ===== */
.shell-main{margin-left:254px}
aside.sidebar{position:fixed;inset:0 auto 0 0;width:254px;background:linear-gradient(170deg,#143f32,#0e3028);padding:28px 18px 20px;display:flex;flex-direction:column;overflow-y:auto;z-index:20}
.brand{display:flex;align-items:center;gap:12px;color:#fff}
.brand img{width:56px;height:56px;border-radius:50%;background:#fff;padding:4px;border:3px solid #ffffff26;flex-shrink:0}
.brand strong{display:block;font:800 24px/1.1 Manrope,sans-serif;letter-spacing:2px}
.brand small{display:block;font-size:9px;letter-spacing:1.5px;color:#a4bdb2;margin-top:4px}
.brand em{display:block;font-style:normal;font-size:8px;letter-spacing:1.2px;color:#d8bd69;margin-top:2px}
.nav-label{font-size:9px;letter-spacing:1.9px;color:#6f9a85;margin:22px 0 8px 14px}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 14px;margin:3px 0;border-radius:8px;color:#b1c6b9;font-size:13px;font-weight:500;text-decoration:none;cursor:pointer}
.nav a:hover{background:#ffffff0d;color:#fff}
.nav a.on{background:#ffffff12;color:#fff;box-shadow:inset 3px 0 var(--gold)}
.nav a.on svg{color:#dfc574}.nav a svg{color:#84ab93;width:18px;height:18px}
.side-foot{margin-top:auto;background:#ffffff06;border-radius:12px;padding:14px;color:#b6cbbb;font-size:11px;line-height:1.6}
.side-foot b{color:#e4ebde}.side-foot p{margin:4px 0 0;color:#91ac9c;font-size:10px}
.mobile-nav{display:none;background:linear-gradient(170deg,#143f32,#0e3028);border-bottom:2px solid #c4ad60;padding:14px 14px 8px}
.mobile-nav .nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-top:12px}
.mobile-nav .nav a{flex-shrink:0;padding:9px 11px;font-size:12px;gap:6px;margin:0}
.mobile-nav .nav a.on{box-shadow:inset 0 -2px #cfba73}
.mobile-nav .brand img{width:44px;height:44px}
header.top{height:72px;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:0 34px;background:var(--card);border-bottom:1px solid var(--line)}
.crumb{font-size:12px;color:var(--muted)}.crumb b{color:var(--ink-2);font-weight:500}
.me{display:flex;align-items:center;gap:10px;margin-left:auto}
.me strong{display:block;font-size:12px;color:var(--ink);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.avatar{width:36px;height:36px;border-radius:10px;background:#eaf0e3;color:#547643;display:grid;place-items:center;font-weight:700;font-size:12px;flex-shrink:0;border:1px solid var(--line)}
.dark .avatar{background:#22362c;color:#a8c79d}
.content{max-width:1400px;margin:0 auto;padding:28px 34px}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{display:grid;gap:18px;grid-template-columns:minmax(0,1.75fr) minmax(280px,1fr)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mt{margin-top:18px}.mb{margin-bottom:18px}
.footer{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:28px;padding-top:16px;color:var(--muted-2);font-size:11px}
@media (max-width:1023px){aside.sidebar{display:none}.shell-main{margin-left:0}.mobile-nav{display:block}.split{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:680px){.content{padding:20px 14px}header.top{padding:0 14px;height:64px}.crumb{display:none}.page-title{font-size:23px}.g3{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}.card{padding:17px 15px}}

/* ===== Stats ===== */
.stat-label{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.stat-icon{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--ok-soft);color:var(--ok)}
.stat-icon.gold{background:var(--warn-soft);color:var(--warn)}.stat-icon.red{background:var(--danger-soft);color:var(--danger)}.stat-icon.plain{background:var(--subtle);color:var(--muted)}
.stat-value{font:700 30px/1.2 Manrope,sans-serif;letter-spacing:-1px;color:var(--ink);margin:8px 0 4px}
.stat-value small{font:400 12px "DM Sans",sans-serif;color:var(--muted);margin-left:4px;letter-spacing:0}
.stat-value.green{color:var(--ok)}.stat-value.red{color:var(--danger)}.stat-value.gold{color:var(--warn)}
.stat-foot{font-size:11px;color:var(--muted-2)}

/* ===== Welcome panel ===== */
.welcome{border-radius:13px;background:linear-gradient(112deg,#194d36,#16422f 58%,#143b2e);display:grid;grid-template-columns:1.6fr 1fr;overflow:hidden;min-height:190px;margin-bottom:18px}
.welcome-copy{padding:24px 28px}
.welcome-copy .lbl{font-size:10px;letter-spacing:1.6px;color:#d3bc72}
.welcome-copy h2{font-size:25px;line-height:1.35;color:#fff9e9;margin:10px 0 6px;font-weight:600}
.welcome-copy p{font-size:13px;color:#a4bdab;margin:0}
.welcome-art{display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#63834c28,transparent 70%)}
.seal{width:104px;height:104px;border-radius:50%;background:#fffdf3;display:grid;place-items:center;font:800 32px Manrope,sans-serif;color:#547643;box-shadow:0 0 0 10px #d2c17b0e,0 0 0 11px #d2c17b22}
.welcome-art span{font-size:9px;letter-spacing:1.6px;color:#9eb596;margin-top:18px;text-align:center}
@media (max-width:680px){.welcome{grid-template-columns:1fr}.welcome-art{display:none}}

/* ===== Today card + clock button ===== */
.today{display:flex;align-items:center;gap:28px;flex-wrap:wrap}.today>div:last-child{flex:1 1 240px}
.clock-btn{flex-shrink:0;width:170px;height:170px;border-radius:50%;border:0;color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:radial-gradient(circle at 30% 25%,#3a8c5c,#1e603a 70%);box-shadow:0 0 0 10px #29774b14,0 0 0 11px #29774b24,0 18px 40px #1e603a40;font-family:Manrope,sans-serif;transition:transform .15s}
.clock-btn:hover{transform:translateY(-2px)}
.clock-btn.out{background:radial-gradient(circle at 30% 25%,#2f6a63,#143f32 70%);box-shadow:0 0 0 10px #d8b75718,0 0 0 11px #d8b75738,0 18px 40px #143f3240}
.clock-btn b{font-size:17px}.clock-btn span{font:11px "DM Sans",sans-serif;opacity:.8}
.clock-btn svg{width:34px;height:34px}
.clock-done{flex-shrink:0;width:170px;height:170px;border-radius:50%;display:grid;place-items:center;background:var(--ok-soft);color:var(--ok);text-align:center;font:700 15px Manrope,sans-serif}
.clock-done svg{width:42px;height:42px;display:block;margin:0 auto 6px}
.tl{list-style:none;padding:0;margin:16px 0 0}
.tl li{display:flex;align-items:center;gap:12px;margin-top:12px}
.tl .dot{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:var(--subtle);color:var(--muted-2);flex-shrink:0}
.tl .dot.on{background:var(--ok-soft);color:var(--ok)}
.tl small{display:block;font-size:10.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--muted-2)}
@media (max-width:680px){.today{flex-direction:column;align-items:stretch}.today>.clock-btn,.today>.clock-done{align-self:center}}

/* ===== Task rows ===== */
.task{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-soft)}
.task:last-child{border-bottom:0}
.task-icon{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;background:var(--warn-soft);color:var(--warn);flex-shrink:0}
.task b{font-size:13px;color:var(--ink-2)}.task small{display:block;font-size:12px;color:var(--muted)}
.progress{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--subtle);margin:18px 0}

/* ===== Scanner mock ===== */
.scanner{position:relative;max-width:400px;aspect-ratio:1;margin:0 auto;border-radius:18px;overflow:hidden;background:radial-gradient(circle at 50% 40%,#1f4a3c,#0e3028)}
.scanner .box{position:absolute;inset:18%;border-radius:14px;box-shadow:0 0 0 9999px #0e302866;border:2px dashed #d8b75780}
.scanner .line{position:absolute;left:22%;right:22%;height:2px;background:linear-gradient(90deg,transparent,#d8b757,transparent);animation:scan 2.2s ease-in-out infinite}
.scanner .cap{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-size:12px;color:#cfe0d3}
@keyframes scan{0%,100%{top:22%}50%{top:76%}}
.divider{display:flex;align-items:center;gap:12px;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted-2);margin:18px 0}
.divider::before,.divider::after{content:"";height:1px;flex:1;background:var(--line)}
.result{text-align:center;padding:26px 0}
.result .ic{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;margin:0 auto 18px}
.result .ic svg{width:42px;height:42px}
.result .ic.ok{background:var(--ok-soft);color:var(--ok)}.result .ic.bad{background:var(--danger-soft);color:var(--danger)}
.result h2{font-size:22px;color:var(--ink);margin:0 0 6px}

/* ===== Modal + toast ===== */
.modal-bg{position:fixed;inset:0;background:var(--backdrop);backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--card);border:1px solid var(--line);border-radius:15px;width:560px;max-width:100%;max-height:calc(100vh - 32px);overflow-y:auto;padding:26px}
.modal h2{font-size:19px;color:var(--ink);margin:0 0 14px}
.modal .actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:20px}
.toast{position:fixed;bottom:22px;right:22px;background:#224f36;color:#fff;padding:12px 18px;border-radius:10px;font-size:13px;z-index:60;box-shadow:0 8px 30px #143e3030;max-width:calc(100vw - 32px)}
.temp-pw{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--card-2);border-radius:10px;padding:12px;margin-top:12px}
.temp-pw code{flex:1;font:600 20px/1 Consolas,monospace;letter-spacing:2px;color:var(--ink)}

/* ===== Login ===== */
.login-wrap{min-height:100vh;padding:28px 14px}
.login-card{position:relative;max-width:620px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:40px 30px;text-align:center;overflow:hidden}
.login-card::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:linear-gradient(90deg,#2c7b47,#d6bc65)}
.login-card img{width:100px;height:100px}
.login-form{max-width:360px;margin:22px auto 0;text-align:left;display:grid;gap:14px}
.demo-box{max-width:420px;margin:26px auto 0;border:1px dashed var(--demo-line);background:var(--demo-bg);border-radius:12px;padding:14px;text-align:left;color:var(--demo-text);font-size:12px}
.demo-box .btn{justify-content:space-between;width:100%;margin-top:8px}

/* ===== Kiosk ===== */
.kiosk{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:72px 24px 40px;background:linear-gradient(150deg,#194d36,#0e3028);color:#fff;position:relative;overflow:hidden}
.kiosk-grid{display:grid;grid-template-columns:auto 1fr;gap:56px;align-items:center;max-width:1050px;width:100%;position:relative;z-index:1}
.kiosk .qr{background:#fff;border-radius:22px;padding:22px;box-shadow:0 0 0 10px #d2c17b14,0 30px 80px #021a1760}
.kiosk .qr svg{display:block;width:min(380px,56vh,40vw);height:auto}
.kiosk h1{font:800 clamp(26px,4vw,40px)/1.15 Manrope,sans-serif;color:#fff9e9;margin:4px 0 0}
.kiosk .bld{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#d3bc72}
.kiosk .clock{font:700 clamp(34px,5vw,54px)/1 Manrope,sans-serif;font-variant-numeric:tabular-nums;margin-top:26px}
.kiosk .ring{display:flex;align-items:center;gap:12px;color:#cfe0d3;font-size:14px;margin-top:18px}
.kiosk .back{position:absolute;top:16px;left:16px;z-index:2}
.kiosk .orbit{position:absolute;border:1px solid #b7be7b14;border-radius:50%}
@media (max-width:820px),(orientation:portrait){.kiosk-grid{grid-template-columns:1fr;justify-items:center;text-align:center;gap:24px}.kiosk .qr svg{width:min(320px,72vw,40vh)}.kiosk .ring{justify-content:center}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast" class="toast hidden" role="status"></div>
<script>
"use strict";
/* ============================================================================
   ISTA Presensi — clickable prototype (single file, sample data in memory).
   The real app: Next.js + Express + database. Nothing here is saved.
   ========================================================================== */
const LOGO = "__LOGO_URI__";
const QR_FRAMES = __QR_FRAMES__;
const DEMO_PASSWORD = "demo123";

/* ---------- small helpers ---------- */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const pad = (n) => String(n).padStart(2, "0");
const jkt = (d = new Date()) => new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Jakarta", year: "numeric", month: "2-digit", day: "2-digit" }).format(d);
const jktTime = (d = new Date()) => new Intl.DateTimeFormat("en-GB", { timeZone: "Asia/Jakarta", hour: "2-digit", minute: "2-digit", hour12: false }).format(d);
const jktTimeSec = (d = new Date()) => new Intl.DateTimeFormat("en-GB", { timeZone: "Asia/Jakarta", hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false }).format(d);
const addDays = (date, n) => { const d = new Date(date + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const addMonths = (date, n) => { const d = new Date(date + "T12:00:00Z"); d.setUTCMonth(d.getUTCMonth() + n); return d.toISOString().slice(0, 10); };
const isWeekend = (date) => { const w = new Date(date + "T12:00:00Z").getUTCDay(); return w === 0 || w === 6; };
const diffDays = (a, b) => Math.round((new Date(a + "T12:00:00Z") - new Date(b + "T12:00:00Z")) / 864e5);
const fmtDate = (date, opts = { day: "numeric", month: "short", year: "numeric" }) => new Intl.DateTimeFormat("id-ID", { timeZone: "Asia/Jakarta", ...opts }).format(new Date(date + "T12:00:00+07:00"));

function balance(uid) {
  const u = userById(uid), year = jkt().slice(0, 4);
  const mine = db.leave.filter((l) => l.userId === uid && l.start.startsWith(year));
  const used = mine.filter((l) => l.status === "APPROVED").reduce((s, l) => s + leaveDays(l), 0);
  const pending = mine.filter((l) => l.status === "PENDING").reduce((s, l) => s + leaveDays(l), 0);

  const remaining = u.quota - used - deducted;
  return { quota: u.quota, used, pending, deducted, remaining, available: remaining - pending };
}

/* ----- Dashboard ----- */
function greeting() { const h = Number(jktTime().slice(0, 2)); return h < 11 ? "Selamat pagi" : h < 15 ? "Selamat siang" : h < 18 ? "Selamat sore" : "Selamat malam"; }
function welcomePanel() {
  return `<section class="welcome"><div class="welcome-copy"><span class="lbl">INSTITUT SAINS DAN TEKNOLOGI AL-KAMAL</span><h2>${greeting()},<br>${esc(S.user.name)}</h2><p>Catat kehadiran Anda dengan memindai kode QR di lokasi kampus.</p></div>
    <div class="welcome-art"><div class="seal">${initials(S.user.name)}</div><span>${ROLE_LABEL[S.user.role].toUpperCase()} · ${esc(S.user.unit).toUpperCase()}</span></div></section>`;
}
function todayCard() {
  const r = todayRecord();
  const state = !r ? "none" : r.out ? "done" : "in";
  const left = state === "done"
    ? `<div class="clock-done"><div>${ic("check")}Lengkap</div></div>`
    : `<button class="clock-btn ${state === "in" ? "out" : ""}" data-action="go" data-page="scan" data-mode="${state === "none" ? "in" : "out"}">${ic("qr")}<b>${state === "none" ? "Absen Masuk" : "Absen Pulang"}</b><span>Pindai kode QR</span></button>`;
  return `<div class="card today">${left}<div style="min-width:0"><div class="eyebrow">KEHADIRAN HARI INI</div><h2 class="display" style="font-size:19px;color:var(--ink);margin:8px 0 0">${fmtLong(jkt())}</h2>
    <ul class="tl"><li><span class="dot ${r ? "on" : ""}">${ic("login")}</span><div><small>Masuk</small>${r ? `<b style="color:var(--ink-2)">Masuk pukul ${r.in} · ${esc(r.loc)}</b>${r.inMethod === "UPLOAD" ? uploadTag() : ""}` : "Anda belum absen masuk hari ini."}</div></li>
    <li><span class="dot ${r && r.out ? "on" : ""}">${ic("logout")}</span><div><small>Pulang</small>${r && r.out ? `<b style="color:var(--ink-2)">Pulang pukul ${r.out} · ${esc(r.loc)}</b>` : "—"}</div></li></ul>
    ${state === "done" ? `<div class="notice notice-ok mt">Kehadiran hari ini sudah lengkap · Durasi kerja ${dur(r.in, r.out)}</div>` : ""}</div></div>`;
}
function missingAlert() {
  const m = missingFor(S.user.id);
  if (!m.length) return "";
  return `<div class="notice mb row" role="alert">${ic("alert")}<div style="flex:1"><b>${m.length} absen pulang perlu diperbaiki</b><br>Perbaiki sebelum ${fmtDate(addMonths(m[0].date, 2))}. Jika tidak, cuti tahunan Anda akan dipotong.</div><button class="btn btn-sm" data-action="go" data-page="fix">Perbaiki sekarang ${ic("arrow")}</button></div>`;
}
PAGES.dashboard = () => S.user.role === "ADMIN" ? adminDashboard() : teacherDashboard();
function teacherDashboard() {
  const b = balance(S.user.id), mine = myAttendance();
  const month = mine.filter((a) => a.date.startsWith(jkt().slice(0, 7))).length;
  const pendingAll = db.leave.filter((l) => l.status === "PENDING" && l.userId !== S.user.id);
  const myPending = db.leave.filter((l) => l.userId === S.user.id && l.status === "PENDING").length;
  return `${welcomePanel()}
  <div class="split mb">${todayCard()}<div class="grid" style="grid-template-columns:1fr">
    ${stat("Sisa cuti tahunan", b.remaining, "hari", `dari ${b.quota} hari · ${jkt().slice(0, 4)}`, "wallet", b.remaining <= 2 ? "red" : "")}
    ${stat("Hadir bulan ini", month, "hari", "hari kerja tercatat", "calcheck", "plain")}</div></div>
  ${missingAlert()}
  ${S.user.role === "APPROVER" && pendingAll.length ? `<div class="card mb"><div class="task"><span class="task-icon">${ic("shield")}</span><div style="flex:1"><b>${pendingAll.length} pengajuan cuti menunggu</b><small>Periksa alasan dan sisa cuti pegawai</small></div><button class="btn btn-sm btn-primary" data-action="go" data-page="approvals">Verifikasi ${ic("arrow")}</button></div></div>` : ""}
  <div class="split"><div class="card flush"><div class="row" style="justify-content:space-between;padding:18px 20px 10px"><h2 class="card-title">Kehadiran terakhir</h2><button class="btn btn-sm" data-action="go" data-page="history">Lihat semua</button></div>
    <div class="table-wrap"><table><thead><tr><th>Tanggal</th><th>Masuk</th><th>Pulang</th><th>Status</th></tr></thead><tbody>
    ${mine.slice(0, 5).map((a) => `<tr><td data-label="Tanggal"><strong>${fmtDate(a.date)}</strong></td><td data-label="Masuk">${a.in}</td><td data-label="Pulang">${a.out || "—"}</td><td data-label="Status">${statusTag(a.status)}</td></tr>`).join("")}</tbody></table></div></div>
    <div class="card"><h2 class="card-title">Pengajuan Cuti</h2>
      <div class="task"><span class="task-icon">${ic("file")}</span><div><b>${myPending} pengajuan menunggu</b><small>Menunggu persetujuan</small></div></div>
      <div class="task"><span class="task-icon">${ic("wallet")}</span><div><b>${b.remaining} / ${b.quota} hari</b><small>Sisa cuti tahunan</small></div></div>
      <button class="btn btn-primary btn-block mt" data-action="go" data-page="leave">Ajukan cuti</button></div></div>`;
}
function adminDashboard() {
  const today = jkt(), active = db.users.filter((u) => u.active).length;
  const recs = db.attendance.filter((a) => a.date === today);
  const done = recs.filter((a) => a.out).length, working = recs.length - done;
  const onLeave = db.leave.filter((l) => l.status === "APPROVED" && l.start <= today && l.end >= today).length;
  const absent = Math.max(0, active - recs.length - onLeave);
  const pending = db.leave.filter((l) => l.status === "PENDING").length, missing = db.attendance.filter((a) => a.status === "MISSING_CLOCK_OUT").length;
  const late = recs.filter((a) => a.in > "08:00").length;
  const seg = [["Hadir", done, "#268369"], ["Masih bekerja", working, "#7ca6a3"], ["Cuti", onLeave, "#d6bc72"], ["Belum hadir", absent, "#cb9d86"]];
  return `${heading("RUANG KERJA", "Dashboard kehadiran", "Pantau kehadiran seluruh pegawai dan tindak lanjuti bersama.", `<button class="btn" data-action="go" data-page="admin-attendance">Absensi Harian</button><button class="btn btn-primary" data-action="go" data-page="admin-locations">Buka layar kios</button>`)}
  ${welcomePanel()}
  <div class="grid g4 mb">${stat("Wajib hadir", active, "pegawai", "Pegawai aktif", "users", "plain")}${stat("Hadir hari ini", recs.length, "pegawai", `${late} terlambat`, "calcheck")}${stat("Cuti hari ini", onLeave, "pegawai", "Cuti tahunan disetujui", "wallet", "gold")}${stat("Perlu tindak lanjut", pending + missing, "", "Pengajuan & absen belum lengkap", "clock", "red")}</div>
  <div class="split"><div class="card"><h2 class="card-title">Ringkasan hari ini</h2><p class="card-sub">${fmtLong(today)} · ${active} pegawai aktif</p>
    <div class="progress">${seg.map(([, n, c]) => `<span style="background:${c};width:${active ? (n / active) * 100 : 0}%"></span>`).join("")}</div>
    <div class="row" style="gap:20px;font-size:12px">${seg.map(([l, n, c]) => `<span class="row" style="gap:6px"><i style="width:7px;height:7px;border-radius:50%;background:${c};display:inline-block"></i>${l} <b style="color:var(--ink-2)">${n}</b></span>`).join("")}</div></div>
    <div class="card"><h2 class="card-title">Perlu perhatian</h2>
      <div class="task"><span class="task-icon">${ic("file")}</span><div style="flex:1"><b>${pending} pengajuan cuti menunggu</b><small>Periksa alasan dan sisa cuti</small></div><button class="btn btn-sm btn-ghost" data-action="go" data-page="approvals">${ic("arrow")}</button></div>
      <div class="task"><span class="task-icon">${ic("clock")}</span><div style="flex:1"><b>${missing} absen pulang belum lengkap</b><small>Pegawai perlu memperbaiki absen pulang</small></div><button class="btn btn-sm btn-ghost" data-action="admin-missing">${ic("arrow")}</button></div></div></div>
  <h2 class="card-title mt mb">Absensi saya</h2>${missingAlert()}${todayCard()}`;
}

/* ----- Scan (simulated camera / image upload) ----- */
PAGES.scan = () => {
  const mode = S.scan?.mode || "in";
  const title = mode === "in" ? "Absen masuk" : "Absen pulang";
  let body;
  if (S.scan?.result === "ok") {
    body = `<div class="result"><div class="ic ok">${ic("check")}</div><h2>${title} berhasil</h2><p class="page-sub">Tercatat pukul ${S.scan.time} di Lobi Gedung A${S.scan.method === "UPLOAD" ? " (dari gambar yang diunggah)" : ""}.</p><button class="btn btn-primary mt" data-action="go" data-page="dashboard">Kembali ke dashboard</button></div>`;
  } else if (S.scan?.result) {
    const msg = { expired: "Kode QR sudah kedaluwarsa. Pindai kode terbaru yang tampil di layar.", done: "Kehadiran hari ini sudah lengkap.", noqr: "Tidak ada kode QR yang terbaca pada gambar ini." }[S.scan.result];
    body = `<div class="result"><div class="ic bad">${ic("x")}</div><h2>Absensi gagal</h2><p class="page-sub">${msg}</p><div class="row mt" style="justify-content:center"><button class="btn" data-action="go" data-page="dashboard">Kembali</button><button class="btn btn-primary" data-action="scan-retry">Pindai ulang</button></div></div>`;
  } else {
    body = `<div class="scanner"><div class="box"></div><div class="line"></div><div class="cap">${ic("camera")} Kamera aktif · arahkan ke kode QR di layar kios</div></div>
      <p class="page-sub" style="text-align:center;margin-top:14px">Di aplikasi sebenarnya, kamera ponsel membaca kode QR yang berganti setiap 30 detik.</p>
      <div class="row" style="justify-content:center;margin-top:14px"><button class="btn btn-primary" data-action="scan-ok" data-method="CAMERA">${ic("qr")} Simulasi pindai kamera</button></div>
      <div class="divider">atau</div>
      <div style="text-align:center"><label class="btn">${ic("upload")} Unggah gambar QR<input type="file" accept="image/*" class="hidden" data-action="scan-upload"></label><p class="tiny" style="margin-top:8px">Pilih foto atau tangkapan layar kode QR (maks. 60 detik sejak tampil di layar).</p></div>
      <p class="tiny" style="text-align:center;margin-top:16px"><a href="#" data-action="scan-expired">Contoh: kode yang sudah kedaluwarsa</a></p>`;
  }
  return `<div style="max-width:560px;margin:0 auto">${heading("PRESENSI", title, "Arahkan kamera ke kode QR yang tampil di layar lokasi kampus.")}<div class="card">${body}</div></div>`;
};

/* ----- History ----- */
PAGES.history = () => {
  const months = Array.from({ length: 4 }, (_, i) => addMonths(jkt().slice(0, 7) + "-01", -i).slice(0, 7));
  const rows = myAttendance().filter((a) => a.date.startsWith(S.month));
  const total = rows.reduce((s, a) => s + (a.out ? mins(a.out) - mins(a.in) : 0), 0);
  const avg = rows.length ? Math.round(rows.reduce((s, a) => s + mins(a.in), 0) / rows.length) : 0;
  return `${heading("RIWAYAT", "Riwayat kehadiran", "Catatan absen masuk dan pulang Anda.", `<select class="input input-inline" data-action="set-month">${months.map((m) => `<option value="${m}" ${m === S.month ? "selected" : ""}>${fmtMonth(m)}</option>`).join("")}</select>`)}
  <div class="grid g3 mb">${stat("Hari hadir", rows.length, "hari", "", "calcheck")}${stat("Total jam", Math.round(total / 60), "jam", "", "clock", "plain")}${stat("Rata-rata masuk", rows.length ? `${pad(Math.floor(avg / 60))}:${pad(avg % 60)}` : "—", "", "", "login", "gold")}</div>
  <div class="card flush"><div class="table-wrap"><table><thead><tr><th>Tanggal</th><th>Masuk</th><th>Pulang</th><th>Durasi</th><th>Lokasi</th><th>Status</th></tr></thead><tbody>
  ${rows.map((a) => `<tr><td data-label="Tanggal"><strong>${fmtDate(a.date)}</strong><small>${fmtWeekday(a.date)}</small></td><td data-label="Masuk">${a.in}${a.inMethod === "UPLOAD" ? uploadTag() : ""}</td><td data-label="Pulang">${a.out || "—"}${a.fixReason ? `<small>✎ ${esc(a.fixReason)}</small>` : ""}</td><td data-label="Durasi">${a.out ? dur(a.in, a.out) : "—"}</td><td data-label="Lokasi">${esc(a.loc)}</td><td data-label="Status">${statusTag(a.status)}</td></tr>`).join("")}
  </tbody></table>${rows.length ? "" : empty()}</div></div>`;
};

/* ----- Leave ----- */
PAGES.leave = () => {
  const b = balance(S.user.id);
  const mine = db.leave.filter((l) => l.userId === S.user.id).sort((a, b2) => b2.created.localeCompare(a.created));
  return `${heading("CUTI", "Pengajuan cuti tahunan", "Ajukan cuti dan pantau status persetujuannya.", `<button class="btn btn-primary" data-action="leave-new">${ic("plus")} Ajukan cuti</button>`)}
  <div class="grid g4 mb">${stat("Sisa", b.remaining, "hari", `Jatah tahun ini: ${b.quota}`, "wallet", b.remaining <= 2 ? "red" : "")}${stat("Terpakai", b.used, "hari", "", "calcheck", "plain")}${stat("Pengajuan menunggu", b.pending, "hari", "", "clock", "gold")}${stat("Dipotong (absen)", b.deducted, "hari", "Absen pulang tidak diperbaiki", "alert", "red")}</div>
  <div class="card flush"><h2 class="card-title" style="padding:18px 20px 8px">Pengajuan saya</h2><div class="table-wrap"><table><thead><tr><th>Periode</th><th>Hari</th><th>Alasan</th><th>Status</th><th></th></tr></thead><tbody>
  ${mine.map((l) => `<tr><td data-label="Periode"><strong>${fmtDate(l.start)}${l.end !== l.start ? " – " + fmtDate(l.end) : ""}</strong><small>Diajukan ${fmtDate(l.created)}</small></td><td data-label="Hari">${leaveDays(l)}</td><td data-label="Alasan" class="wide">${esc(l.reason)}${l.note ? `<small>💬 ${esc(l.note)}</small>` : ""}</td><td data-label="Status">${statusTag(l.status)}${l.by ? `<small>oleh ${esc(userById(l.by).name)}</small>` : ""}</td><td data-label="">${l.status === "PENDING" ? `<button class="btn btn-sm btn-danger" data-action="leave-cancel" data-id="${l.id}">Batalkan</button>` : ""}</td></tr>`).join("")}
  </tbody></table>${mine.length ? "" : empty()}</div></div>`;
};
function leaveForm() {
  const start = addDays(jkt(), 1);
  modal("Ajukan cuti", `<div class="grid g2"><label class="field">Tanggal mulai<input class="input" type="date" id="lv-start" value="${start}" min="${start}" data-action="leave-calc"></label><label class="field">Tanggal selesai<input class="input" type="date" id="lv-end" value="${start}" min="${start}" data-action="leave-calc"></label></div>
    <label class="field mt">Alasan<textarea class="input" id="lv-reason" placeholder="Contoh: acara keluarga di luar kota"></textarea></label><div id="lv-info" class="notice notice-ok mt"></div>`,
    `<button class="btn" data-action="close-modal">Batal</button><button class="btn btn-primary" data-action="leave-submit">Kirim</button>`);
  leaveCalc();
}
function leaveCalc() {
  const s = $("#lv-start").value, e = $("#lv-end").value, info = $("#lv-info"), b = balance(S.user.id);
  const days = workdays(s, e);
  const bad = !s || !e || e < s, over = days > b.available;
  info.className = `notice mt ${bad || over || !days ? "notice-bad" : "notice-ok"}`;
  info.textContent = bad ? "Tanggal selesai harus sama atau setelah tanggal mulai." : `${days} hari kerja (Sabtu, Minggu & hari libur tidak dihitung)${over ? ` · Melebihi sisa cuti Anda (${b.available} hari).` : ""}`;
  return !bad && !over && days > 0;
}

/* ----- Fix missing clock-out ----- */
PAGES.fix = () => {
  const missing = missingFor(S.user.id);
  const past = myAttendance().filter((a) => a.status === "FIXED" || a.status === "DEDUCTED");
  return `${heading("PERBAIKAN", "Perbaiki absen pulang", "Hari di mana Anda lupa absen pulang. Isi jam pulang dan alasannya.")}

    <div id="fx-err-${a.id}" class="notice notice-bad mt hidden"></div><div class="row mt" style="justify-content:flex-end"><button class="btn btn-primary" data-action="fix-save" data-id="${a.id}">${ic("check")} Perbaiki</button></div></div>`; }).join("")}</div>` : `<div class="card">${empty("Tidak ada absen pulang yang perlu diperbaiki. 👍")}</div>`}
  <div class="card flush mt"><h2 class="card-title" style="padding:18px 20px 8px">Riwayat perbaikan &amp; potongan</h2><div class="table-wrap"><table><thead><tr><th>Tanggal</th><th>Masuk</th><th>Pulang</th><th>Keterangan</th><th>Status</th></tr></thead><tbody>
  ${past.map((a) => `<tr><td data-label="Tanggal"><strong>${fmtDate(a.date)}</strong></td><td data-label="Masuk">${a.in}</td><td data-label="Pulang">${a.out || "—"}</td><td data-label="Keterangan" class="wide">${a.status === "FIXED" ? esc(a.fixReason) : "1 hari cuti dipotong otomatis"}</td><td data-label="Status">${statusTag(a.status)}</td></tr>`).join("")}
  </tbody></table>${past.length ? "" : empty()}</div></div>`;
};

/* ----- Settings ----- */
PAGES.settings = () => {
  const u = S.user, dark = document.documentElement.classList.contains("dark");

    <div class="grid g2 mt" style="font-size:13px"><div><span class="tiny">NIP</span><br><b>${u.nip}</b></div><div><span class="tiny">PERAN</span><br><b>${ROLE_LABEL[u.role]}</b></div><div><span class="tiny">UNIT</span><br><b>${esc(u.unit)}</b></div><div><span class="tiny">JATAH CUTI</span><br><b>${u.quota} hari</b></div></div></div>

  <div class="card row" style="justify-content:space-between"><div><h2 class="card-title">Tema warna</h2><p class="card-sub">Tampilan terang atau gelap.</p></div><div class="row"><button class="btn btn-sm ${dark ? "" : "btn-primary"}" data-action="theme-set" data-theme="light">${ic("sun")} Terang</button><button class="btn btn-sm ${dark ? "btn-primary" : ""}" data-action="theme-set" data-theme="dark">${ic("moon")} Gelap</button></div></div></div>`;

</script>
<script>
"use strict";
/* ============================== Approver & admin pages ============================== */
PAGES.approvals = () => {
  const pending = db.leave.filter((l) => l.status === "PENDING").sort((a, b) => a.start.localeCompare(b.start));
  const decided = db.leave.filter((l) => l.status !== "PENDING");
  const overlaps = (r) => db.leave.filter((l) => l.id !== r.id && l.status !== "REJECTED" && l.start <= r.end && l.end >= r.start);
  const tab = (id, label, n) => `<button class="btn btn-sm ${S.approvalsTab === id ? "btn-primary" : ""}" data-action="approvals-tab" data-tab="${id}">${label} <span class="tag tag-gray" style="padding:1px 6px">${n}</span></button>`;
  const body = S.approvalsTab === "pending"
    ? (pending.length ? `<div class="grid g2">${pending.map((r) => { const u = userById(r.userId), b = balance(r.userId), ov = overlaps(r); const own = r.userId === S.user.id; return `<div class="card"><div class="row" style="align-items:flex-start">${avatar(u.name)}<div style="flex:1;min-width:0"><b style="color:var(--ink-2)">${esc(u.name)}</b><div class="tiny">${esc(u.unit)}</div></div>${own ? '<span class="tag tag-gray">Pengajuan Anda</span>' : statusTag(r.status)}</div>
        <div class="display mt" style="font-weight:600;color:var(--ink)">${fmtDate(r.start)}${r.end !== r.start ? " – " + fmtDate(r.end) : ""} <span style="font-weight:400;color:var(--muted)">· ${leaveDays(r)} hari</span></div><p class="page-sub">${esc(r.reason)}</p>
        <div class="row mt"><span class="tag">Sisa: ${b.remaining} hari</span>${ov.length ? `<span class="tag tag-warn">Bentrok dengan ${ov.length} pengajuan lain</span>` : ""}</div>
        <div class="row mt" style="justify-content:flex-end"><button class="btn btn-sm btn-primary" data-action="decide-open" data-id="${r.id}" ${own ? "disabled" : ""}>Setujui / Tolak ${ic("arrow")}</button></div></div>`; }).join("")}</div>` : `<div class="card">${empty("Tidak ada pengajuan yang menunggu. 🎉")}</div>`)
    : `<div class="card flush"><div class="table-wrap"><table><thead><tr><th>Nama</th><th>Periode</th><th>Hari</th><th>Status</th><th>Catatan</th></tr></thead><tbody>${decided.map((r) => `<tr><td data-label="Nama"><strong>${esc(userById(r.userId).name)}</strong></td><td data-label="Periode">${fmtDate(r.start)}${r.end !== r.start ? " – " + fmtDate(r.end) : ""}</td><td data-label="Hari">${leaveDays(r)}</td><td data-label="Status">${statusTag(r.status)}<small>oleh ${esc(userById(r.by).name)}</small></td><td data-label="Catatan" class="wide">${esc(r.note || "—")}</td></tr>`).join("")}</tbody></table></div></div>`;
  return `${heading("VERIFIKASI", "Verifikasi pengajuan cuti", "Periksa alasan, sisa cuti, dan bentrok jadwal sebelum menyetujui.")}<div class="row mb">${tab("pending", "Menunggu", pending.length)}${tab("decided", "Sudah diputuskan", decided.length)}</div>${body}`;
};
function decideModal(id) {
  const r = db.leave.find((l) => l.id === id), u = userById(r.userId), b = balance(r.userId), after = b.remaining - leaveDays(r);
  modal("Verifikasi pengajuan cuti", `<div class="row">${avatar(u.name)}<div><b style="color:var(--ink-2)">${esc(u.name)}</b><div class="tiny">${esc(u.unit)} · ${u.nip}</div></div></div>
    <div class="grid g2 mt" style="background:var(--card-2);border-radius:12px;padding:14px;font-size:13px"><div><span class="tiny">PERIODE</span><br><b>${fmtDate(r.start)}${r.end !== r.start ? " – " + fmtDate(r.end) : ""}</b><br><span class="tiny">${leaveDays(r)} hari</span></div><div><span class="tiny">SISA CUTI</span><br><b>${b.remaining} hari</b><br><span class="tiny">Sisa setelah disetujui: ${after} hari</span></div><div style="grid-column:1/-1"><span class="tiny">ALASAN</span><br>${esc(r.reason)}</div></div>
    <label class="field mt">Catatan keputusan (wajib saat menolak)<textarea class="input" id="dc-note"></textarea></label><div id="dc-err" class="notice notice-bad mt hidden">Catatan wajib diisi saat menolak.</div>`,
    `<button class="btn btn-danger" data-action="decide" data-id="${id}" data-approve="0">${ic("x")} Tolak</button><button class="btn btn-primary" data-action="decide" data-id="${id}" data-approve="1" ${after < 0 ? "disabled" : ""}>${ic("check")} Setujui</button>`);
}

  return `${heading("ADMINISTRASI", "Absensi harian", "Catatan masuk dan pulang seluruh pegawai.", `<button class="btn" data-action="toast" data-msg="Di aplikasi sebenarnya: unduh CSV untuk Excel.">${ic("download")} Ekspor CSV</button>`)}

  ${rows.map((a) => { const u = userById(a.userId); return `<tr><td data-label="Nama"><div class="row" style="flex-wrap:nowrap">${avatar(u.name)}<div><strong>${esc(u.name)}</strong><small>${esc(u.unit)}</small></div></div></td><td data-label="Tanggal">${fmtDate(a.date)}</td><td data-label="Masuk">${a.in}${a.inMethod === "UPLOAD" ? uploadTag() : ""}${a.in > "08:00" ? '<small style="color:var(--danger)">Terlambat</small>' : ""}</td><td data-label="Pulang">${a.out || "—"}${a.outMethod === "UPLOAD" ? uploadTag() : ""}</td><td data-label="Lokasi">${esc(a.loc)}</td><td data-label="Status">${statusTag(a.status)}</td></tr>`; }).join("")}
  </tbody></table>${rows.length ? "" : empty()}</div></div>`;
};

PAGES["admin-leave"] = () => `${heading("ADMINISTRASI", "Semua pengajuan cuti", "Seluruh pengajuan cuti pegawai. Admin juga dapat menyetujui.")}
  <div class="card flush"><div class="table-wrap"><table><thead><tr><th>Nama</th><th>Periode</th><th>Hari</th><th>Alasan</th><th>Status</th><th></th></tr></thead><tbody>
  ${[...db.leave].sort((a, b) => b.start.localeCompare(a.start)).map((l) => `<tr><td data-label="Nama"><strong>${esc(userById(l.userId).name)}</strong><small>${esc(userById(l.userId).unit)}</small></td><td data-label="Periode">${fmtDate(l.start)}${l.end !== l.start ? " – " + fmtDate(l.end) : ""}</td><td data-label="Hari">${leaveDays(l)}</td><td data-label="Alasan" class="wide">${esc(l.reason)}</td><td data-label="Status">${statusTag(l.status)}</td><td data-label="">${l.status === "PENDING" ? `<button class="btn btn-sm btn-primary" data-action="decide-open" data-id="${l.id}">Setujui / Tolak</button>` : ""}</td></tr>`).join("")}

PAGES["admin-users"] = () => `${heading("ADMINISTRASI", "Data pegawai", "Kelola akun, peran, dan jatah cuti tahunan.", `<button class="btn btn-primary" data-action="user-new">${ic("plus")} Tambah pegawai</button>`)}
  <div class="card flush"><div class="table-wrap"><table><thead><tr><th>Nama</th><th>NIP</th><th>Unit</th><th>Peran</th><th>Sisa cuti</th><th>Status</th><th></th></tr></thead><tbody>
  ${db.users.map((u) => `<tr><td data-label="Nama"><div class="row" style="flex-wrap:nowrap">${avatar(u.name)}<div><strong>${esc(u.name)}</strong><small>${esc(u.email)}</small></div></div></td><td data-label="NIP">${u.nip}</td><td data-label="Unit">${esc(u.unit)}</td><td data-label="Peran"><span class="tag ${u.role === "ADMIN" ? "tag-bad" : u.role === "APPROVER" ? "tag-warn" : "tag-gray"}">${ROLE_LABEL[u.role]}</span></td><td data-label="Sisa cuti">${balance(u.id).remaining} / ${u.quota}</td><td data-label="Status"><span class="tag ${u.active ? "" : "tag-gray"}">${u.active ? "Aktif" : "Nonaktif"}</span>${u.mustChange ? "<small>Belum ganti sandi</small>" : ""}</td><td data-label="">${u.id === S.user.id ? "" : `<button class="btn btn-sm" data-action="user-reset" data-id="${u.id}">${ic("key")} Reset sandi</button>`}</td></tr>`).join("")}

function tempPw() { const a = "ABCDEFGHJKMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789"; let s; do { s = Array.from({ length: 10 }, () => a[Math.floor(Math.random() * a.length)]).join(""); } while (!/\d/.test(s) || !/[A-Za-z]/.test(s)); return s; }
function showTempPw(name, pw) { modal("Kata sandi sementara", `<p class="page-sub">Kata sandi sementara untuk ${esc(name)} hanya ditampilkan sekali. Berikan kepadanya; kata sandi harus diganti saat pertama kali masuk.</p><div class="temp-pw"><code>${pw}</code></div>`, `<button class="btn btn-primary" data-action="close-modal">Tutup</button>`); }

PAGES["admin-reports"] = () => {
  const ym = jkt().slice(0, 7), today = jkt(), from = ym + "-01", hs = holidaySet();
  const days = []; for (let d = from; d <= today; d = addDays(d, 1)) if (!isWeekend(d) && !hs.has(d)) days.push(d);
  const rows = db.users.filter((u) => u.active).map((u) => {
    const mine = db.attendance.filter((a) => a.userId === u.id && a.date.startsWith(ym));
    const present = new Set(mine.map((a) => a.date));
    const lv = new Set(); db.leave.filter((l) => l.userId === u.id && l.status === "APPROVED").forEach((l) => { for (let d = l.start; d <= l.end; d = addDays(d, 1)) if (days.includes(d)) lv.add(d); });
    return { u, present: present.size, late: mine.filter((a) => a.in > "08:00").length, leave: lv.size, absent: days.filter((d) => d < today && !present.has(d) && !lv.has(d)).length, missing: mine.filter((a) => a.status === "MISSING_CLOCK_OUT").length, uploads: mine.filter((a) => a.inMethod === "UPLOAD" || a.outMethod === "UPLOAD").length };
  });
  const n = (v, tone) => v > 0 && tone ? `<b style="color:var(--${tone})">${v}</b>` : v;
  return `${heading("LAPORAN", "Rekap bulanan", `Ringkasan kehadiran setiap pegawai aktif · ${fmtMonth(ym)}`, `<button class="btn" data-action="toast" data-msg="Di aplikasi sebenarnya: unduh CSV rekap.">${ic("download")} Ekspor CSV</button>`)}
  <div class="grid g3 mb">${stat("Hari kerja", days.length, "hari", `1 – ${fmtDate(today, { day: "numeric", month: "short" })}`, "calcheck", "plain")}${stat("Hari libur", db.holidays.filter((h) => h.date.startsWith(ym)).length, "hari", "", "caloff", "gold")}</div>
  <div class="card flush"><div class="table-wrap"><table><thead><tr><th>Nama</th><th>Hadir</th><th>Terlambat</th><th>Cuti</th><th>Tanpa ket.</th><th>Belum absen pulang</th><th>Via unggahan</th></tr></thead><tbody>
  ${rows.map((r) => `<tr><td data-label="Nama"><strong>${esc(r.u.name)}</strong><small>${esc(r.u.unit)}</small></td><td data-label="Hadir"><strong>${r.present}</strong></td><td data-label="Terlambat">${n(r.late, "warn")}</td><td data-label="Cuti">${r.leave}</td><td data-label="Tanpa ket.">${n(r.absent, "danger")}</td><td data-label="Belum absen pulang">${n(r.missing, "warn")}</td><td data-label="Via unggahan">${n(r.uploads, "warn")}</td></tr>`).join("")}
  </tbody></table></div></div>`;
};

PAGES["admin-locations"] = () => `${heading("ADMINISTRASI", "Lokasi QR", "Setiap lokasi menampilkan kode QR berganti di layar kios.")}
  <div class="grid g3">${db.locations.map((l) => { const scans = db.attendance.filter((a) => a.date === jkt() && a.loc === l.name).length; return `<div class="card"><div class="row" style="align-items:flex-start;flex-wrap:nowrap"><span class="stat-icon">${ic("pin")}</span><div style="flex:1"><h3 class="card-title">${esc(l.name)}</h3><p class="tiny">${esc(l.building)} · ${l.id}</p></div><span class="tag ${l.active ? "" : "tag-gray"}">${l.active ? "Aktif" : "Nonaktif"}</span></div>
    <div class="grid g2 mt" style="background:var(--card-2);border-radius:10px;padding:12px;font-size:12px"><div><span class="tiny">Pindaian hari ini</span><br><b>${scans}</b></div><div><span class="tiny">Kios</span><br><b>${l.paired ? "Terpasang" : "Belum ada"}</b></div></div>
    <p class="tiny mt">Kode berganti setiap 30 detik</p><div class="row mt" style="justify-content:flex-end"><button class="btn btn-sm" ${l.active ? "" : "disabled"} data-action="toast" data-msg="Di aplikasi sebenarnya: unduh kode QR saat ini sebagai PNG (berlaku ±60 detik).">${ic("download")} Unduh QR</button><button class="btn btn-sm btn-primary" ${l.active ? "" : "disabled"} data-action="kiosk" data-id="${l.id}">${ic("monitor")} Buka layar kios</button></div></div>`; }).join("")}</div>`;

PAGES["admin-holidays"] = () => `<div style="max-width:860px">${heading("KALENDER", "Hari libur", "Hari libur nasional dan libur kampus tidak dihitung sebagai hari cuti.", `<button class="btn btn-primary" data-action="holiday-new">${ic("plus")} Tambah hari libur</button>`)}
  <div class="notice mb">Libur nasional bertanggal tetap sudah terisi. Tambahkan libur yang berubah setiap tahun (Idul Fitri, Idul Adha, Nyepi, Waisak, Imlek, dll.) sesuai SKB 3 Menteri.</div>
  <div class="card flush">${[...db.holidays].sort((a, b) => a.date.localeCompare(b.date)).map((h) => `<div class="task" style="padding:13px 20px"><span class="task-icon">${ic("caloff")}</span><div style="flex:1"><b>${esc(h.name)}</b><small>${fmtWeekday(h.date)}, ${fmtDate(h.date)}</small></div><button class="btn btn-sm btn-danger" data-action="holiday-del" data-date="${h.date}">${ic("trash")} Hapus</button></div>`).join("")}</div></div>`;

/* ----- Kiosk (full screen, rotating QR) ----- */
function kioskPage() {
  const loc = db.locations.find((l) => l.id === S.kioskLoc), now = Date.now();
  const frame = QR_FRAMES[Math.floor(now / 30000) % QR_FRAMES.length];
  const secs = Math.ceil((30000 - (now % 30000)) / 1000), C = 2 * Math.PI * 22;
  return `<div class="kiosk"><span class="orbit" style="width:620px;height:620px"></span><span class="orbit" style="width:860px;height:860px"></span>
    <button class="btn btn-sm back" data-action="kiosk-close">← Kembali ke admin</button>
    <div class="kiosk-grid"><div style="display:flex;flex-direction:column;align-items:center"><div class="qr">${frame}</div>
      <div class="ring"><svg width="52" height="52" viewBox="0 0 52 52" style="transform:rotate(-90deg)"><circle cx="26" cy="26" r="22" fill="none" stroke="#ffffff1a" stroke-width="4"/><circle cx="26" cy="26" r="22" fill="none" stroke="#d8b757" stroke-width="4" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - secs / 30)}"/></svg><span id="k-secs">Kode baru dalam ${secs} detik</span></div></div>
    <div><div class="brand" style="margin-bottom:28px">${'<img src="' + LOGO + '" alt="">'}<div><strong>ISTA</strong><em>PRESENSI &amp; ADMINISTRASI</em></div></div>
      <div class="bld">${esc(loc.building)}</div><h1>${esc(loc.name)}</h1>
      <h2 class="display" style="font-size:20px;margin:22px 0 4px">Pindai untuk absen</h2><p style="color:#a4bdab;font-size:13px;max-width:420px;margin:0">Buka aplikasi Presensi ISTA, tekan Absen Masuk / Pulang, lalu pindai kode ini.</p>
      <div class="clock">${jktTimeSec()}</div><div style="color:#a4bdab;font-size:13px;margin-top:8px">${fmtLong(jkt())} · WIB</div></div></div></div>`;
}
</script>
<script>
"use strict";
/* ============================== Render + events ============================== */
let kioskTimer = null;
function render() {
  clearInterval(kioskTimer);
  const app = $("#app");
  if (!S.user) { app.innerHTML = loginPage(); return; }
  if (S.page === "kiosk") {
    app.innerHTML = kioskPage();
    kioskTimer = setInterval(() => { if (S.page === "kiosk") $("#app").innerHTML = kioskPage(); }, 1000);
    return;
  }
  const allowed = NAV.find((n) => n.id === S.page);
  if (allowed && !allowed.roles.includes(S.user.role)) S.page = "dashboard";
  app.innerHTML = shell((PAGES[S.page] || PAGES.dashboard)());
}
function login(id) { S.user = userById(id); S.page = "dashboard"; S.scan = null; render(); window.scrollTo(0, 0); }
function go(page, extra = {}) { S.page = page; if (page === "scan") S.scan = { mode: extra.mode || "in" }; closeModal(); render(); window.scrollTo(0, 0); }

function doScan(method) {
  const today = jkt(), r = todayRecord(), time = jktTime();
  if (S.scan.mode === "in") {
    if (r) { S.scan.result = "done"; return render(); }
    db.attendance.push({ id: db.nextId++, userId: S.user.id, date: today, in: time, out: null, loc: "Lobi Gedung A", status: "CLOCKED_IN", inMethod: method, outMethod: null });
  } else {
    if (!r || r.out) { S.scan.result = "done"; return render(); }
    Object.assign(r, { out: time, status: "COMPLETE", outMethod: method });
  }
  Object.assign(S.scan, { result: "ok", time, method });
  render();
}

const ACTIONS = {
  go: (d) => go(d.page, d),
  "quick-login": (d) => login(d.id),
  logout: () => { S.user = null; render(); },
  "switch-role": (d, el) => login(el.value),
  reset: () => { db = buildData(); toast("Data contoh dikembalikan."); render(); },
  theme: () => { document.documentElement.classList.toggle("dark"); render(); },
  "theme-set": (d) => { document.documentElement.classList.toggle("dark", d.theme === "dark"); toast("Pengaturan disimpan."); render(); },
  toast: (d) => toast(d.msg),
  "close-modal": closeModal,
  "modal-bg": (d, el, e) => { if (e.target === el) closeModal(); },
  "scan-ok": (d) => doScan(d.method),
  "scan-upload": (d, el) => { if (el.files && el.files[0]) { S.scan.result = null; toast("Membaca kode QR dari gambar…"); setTimeout(() => doScan("UPLOAD"), 600); } },
  "scan-expired": (d, el, e) => { e.preventDefault(); S.scan.result = "expired"; render(); },
  "scan-retry": () => { S.scan = { mode: S.scan.mode }; render(); },
  "set-month": (d, el) => { S.month = el.value; render(); },
  "leave-new": leaveForm,
  "leave-calc": leaveCalc,
  "leave-submit": () => {
    const reason = $("#lv-reason").value.trim();
    if (!leaveCalc()) return;
    if (reason.length < 5) { $("#lv-info").className = "notice notice-bad mt"; $("#lv-info").textContent = "Alasan wajib diisi."; return; }
    const s = $("#lv-start").value, e = $("#lv-end").value;
    if (db.leave.some((l) => l.userId === S.user.id && l.status !== "REJECTED" && l.start <= e && l.end >= s)) { $("#lv-info").className = "notice notice-bad mt"; $("#lv-info").textContent = "Tanggal ini bertabrakan dengan pengajuan Anda yang lain."; return; }
    db.leave.push({ id: "l" + Date.now(), userId: S.user.id, start: s, end: e, reason, status: "PENDING", created: jkt() });
    closeModal(); toast("Pengajuan cuti terkirim dan menunggu persetujuan."); render();
  },
  "leave-cancel": (d) => { db.leave = db.leave.filter((l) => l.id !== d.id); toast("Pengajuan dibatalkan."); render(); },
  "fix-save": (d) => {
    const a = db.attendance.find((x) => x.id === Number(d.id)), t = $(`#fx-time-${d.id}`).value, reason = $(`#fx-reason-${d.id}`).value.trim(), err = $(`#fx-err-${d.id}`);
    if (t <= a.in) { err.textContent = `Jam pulang harus setelah jam masuk (${a.in}).`; err.classList.remove("hidden"); return; }
    if (reason.length < 10) { err.textContent = "Alasan wajib diisi (minimal 10 karakter)."; err.classList.remove("hidden"); return; }
    Object.assign(a, { out: t, status: "FIXED", fixReason: reason }); toast("Absen pulang diperbaiki."); render();
  },
  "approvals-tab": (d) => { S.approvalsTab = d.tab; render(); },
  "decide-open": (d) => decideModal(d.id),
  decide: (d) => {
    const note = $("#dc-note").value.trim();
    if (d.approve === "0" && !note) { $("#dc-err").classList.remove("hidden"); return; }
    Object.assign(db.leave.find((l) => l.id === d.id), { status: d.approve === "1" ? "APPROVED" : "REJECTED", by: S.user.id, note: note || undefined });
    closeModal(); toast(d.approve === "1" ? "Pengajuan disetujui." : "Pengajuan ditolak."); render();
  },
  "admin-date": (d, el) => { S.adminDate = el.value || jkt(); S.adminStatus = ""; render(); },
  "admin-status": (d, el) => { S.adminStatus = el.value; render(); },
  "admin-missing": () => { S.adminStatus = "MISSING_CLOCK_OUT"; go("admin-attendance"); },
  "user-new": () => modal("Tambah pegawai", `<div class="grid g2"><label class="field" style="grid-column:1/-1">Nama<input class="input" id="nu-name" placeholder="Nama lengkap"></label><label class="field">Email<input class="input" id="nu-email" type="email" placeholder="nama@ista.ac.id"></label><label class="field">NIP<input class="input" id="nu-nip"></label><label class="field">Unit<input class="input" id="nu-unit"></label><label class="field">Peran<select class="input" id="nu-role"><option value="USER">Dosen</option><option value="APPROVER">Penyetuju</option><option value="ADMIN">Administrator</option></select></label></div><div id="nu-err" class="notice notice-bad mt hidden">Lengkapi nama, email, dan NIP.</div>`, `<button class="btn" data-action="close-modal">Batal</button><button class="btn btn-primary" data-action="user-save">Simpan</button>`),
  "user-save": () => {
    const name = $("#nu-name").value.trim(), email = $("#nu-email").value.trim(), nip = $("#nu-nip").value.trim();
    if (name.length < 3 || !/\S+@\S+\.\S+/.test(email) || nip.length < 3) { $("#nu-err").classList.remove("hidden"); return; }
    db.users.push({ id: "n" + Date.now(), name, email, nip, unit: $("#nu-unit").value.trim(), role: $("#nu-role").value, quota: 12, active: true, mustChange: true });
    render(); showTempPw(name, tempPw());
  },
  "user-reset": (d) => { const u = userById(d.id); u.mustChange = true; render(); showTempPw(u.name, tempPw()); },
  kiosk: (d) => { S.kioskLoc = d.id; S.page = "kiosk"; render(); window.scrollTo(0, 0); },
  "kiosk-close": () => go("admin-locations"),
  "holiday-new": () => modal("Tambah hari libur", `<div class="grid" style="grid-template-columns:170px 1fr"><label class="field">Tanggal<input class="input" type="date" id="hd-date" value="${jkt()}"></label><label class="field">Keterangan<input class="input" id="hd-name" placeholder="Contoh: Hari Raya Idul Fitri"></label></div>`, `<button class="btn" data-action="close-modal">Batal</button><button class="btn btn-primary" data-action="holiday-save">Simpan</button>`),
  "holiday-save": () => { const date = $("#hd-date").value, name = $("#hd-name").value.trim(); if (!date || name.length < 2) return; db.holidays = db.holidays.filter((h) => h.date !== date).concat({ date, name }); closeModal(); toast("Hari libur disimpan."); render(); },
  "holiday-del": (d) => { db.holidays = db.holidays.filter((h) => h.date !== d.date); toast("Hari libur dihapus."); render(); },
};

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el || el.tagName === "SELECT" || el.tagName === "INPUT") return;
  const fn = ACTIONS[el.dataset.action];
  if (fn) fn(el.dataset, el, e);
});
document.addEventListener("change", (e) => {
  const el = e.target.closest("[data-action]");
  if (el && (el.tagName === "SELECT" || el.tagName === "INPUT")) { const fn = ACTIONS[el.dataset.action]; if (fn) fn(el.dataset, el, e); }
});
document.addEventListener("submit", (e) => {
  if (e.target.dataset.form !== "login") return;
  e.preventDefault();
  const email = $("#lg-email").value.trim().toLowerCase(), pw = $("#lg-pw").value;
  const u = db.users.find((x) => x.email === email && x.active);
  if (!u || pw !== DEMO_PASSWORD) { $("#lg-err").classList.remove("hidden"); return; }
  login(u.id);
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });
if (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.classList.add("dark");
render();
</script>
</body>
</html>
