# Example Nginx site for ISTA Presensi behind the client's existing Nginx.
# Replace absen.example.ac.id and the certificate paths with the real ones.

server {
    listen 80;
    server_name absen.example.ac.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name absen.example.ac.id;

    # Existing certificate (or: certbot --nginx -d absen.example.ac.id)
    ssl_certificate     /etc/letsencrypt/live/absen.example.ac.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/absen.example.ac.id/privkey.pem;

    # Profile photos are up to 5 MB (Nginx's default limit is 1 MB).
    client_max_body_size 6m;

    # The QR scanner needs the camera. If the server adds a Permissions-Policy header elsewhere,
    # make sure it allows camera=(self).

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
