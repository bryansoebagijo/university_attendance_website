# Example Apache virtual host for ISTA Presensi behind the client's existing Apache.
# Needs: a2enmod proxy proxy_http headers ssl rewrite
# Replace absen.example.ac.id and the certificate paths with the real ones.

<VirtualHost *:80>
    ServerName absen.example.ac.id
    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName absen.example.ac.id

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/absen.example.ac.id/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/absen.example.ac.id/privkey.pem

    # Profile photos are up to 5 MB.
    LimitRequestBody 6291456

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass        / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/
    ProxyTimeout 60

    # The QR scanner needs the camera. If a Permissions-Policy header is set elsewhere,
    # make sure it allows camera=(self).
</VirtualHost>
